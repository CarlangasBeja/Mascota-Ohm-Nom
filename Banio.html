<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Baño</title>

    <link rel="stylesheet" href="css/banio.css">

</head>

<body>


    <!-- =====================================================
         INFORMACIÓN
         ===================================================== -->

    <div class="column-texts">

        <div class="fondo">

            <div class="contenedor">

                <div id="text1">
                    Level: 1
                </div>

                <div id="textEstado">
                    Estado: 😀
                </div>

            </div>


            <div id="text2">

                <img
                    src="imagenes/corazonPixeles.png"
                    alt="Vida"
                >

                Vida

            </div>


            <div id="text3">

                <img
                    src="imagenes/felicidadPixeles.png"
                    alt="Felicidad"
                >

                Felicidad

            </div>


            <div id="text4">

                <img
                    src="imagenes/pesoPixel.png"
                    alt="Peso"
                >

                Peso

            </div>


            <div id="text5">

                <img
                    src="imagenes/vistoPixel.png"
                    alt="Baño"
                >

                Quiere ir al baño

            </div>


            <div id="text6">

                <img
                    src="imagenes/xPixel.png"
                    alt="Dormir"
                >

                Quiere ir a dormir

            </div>

        </div>


        <div class="fondo mensajes-fondo">

            <div id="mensajes"></div>

        </div>

    </div>



    <!-- =====================================================
         NAVEGACIÓN
         ===================================================== -->

    <div class="button-container">

        <button onclick="goToSalaPrincipal()">

            <img
                src="imagenes/sala.png"
                alt="Sala"
                class="button-image"
            >

        </button>


        <button onclick="goToComer()">

            <img
                src="imagenes/comida.png"
                alt="Comida"
                class="button-image"
            >

        </button>


        <button onclick="goToDormir()">

            <img
                src="imagenes/dormirr.png"
                alt="Dormir"
                class="button-image"
            >

        </button>


        <button onclick="goToJugar()">

            <img
                src="imagenes/pelota.png"
                alt="Jugar"
                class="button-image"
            >

        </button>


        <button onclick="guardados.accionarBotonesDidacticos('guardar')">

            <img
                src="imagenes/guarda.png"
                alt="Guardar"
                class="button-image"
            >

        </button>


        <button onclick="guardados.accionarBotonesDidacticos('salir')">

            <img
                src="imagenes/salir.png"
                alt="Salir"
                class="button-image"
            >

        </button>

    </div>



    <!-- =====================================================
         MASCOTA
         ===================================================== -->

    <img
        id="imagenEncima"
        src="imagenes/om nom banio.gif"
        alt="Tamagochi"
    >


    <div id="textoEncima">
        Tamagochi
    </div>


    <div id="textoEsquina">
        Jugador
    </div>



    <!-- =====================================================
         BOTÓN DE ACCIÓN
         ===================================================== -->

    <button
        id="botonAccion"
        onclick="guardados.accionarBotonesDidacticos('usarBanio')"
    >

        <img
            src="imagenes/bañoAccion.jpeg"
            alt="Baño"
        >

    </button>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/models/Tamagochi.js"></script>
    <script src="js/models/Jugador.js"></script>

    <script src="js/repositories/IPlayerRepository.js"></script>
    <script src="js/repositories/IMessageRepository.js"></script>

    <script src="js/repositories/LocalStoragePlayerRepository.js"></script>
    <script src="js/repositories/LocalStorageMessageRepository.js"></script>

    <script src="js/services/MascotaService.js"></script>
    <script src="js/services/PlayerService.js"></script>
    <script src="js/services/GameService.js"></script>
    <script src="js/services/TimerService.js"></script>

    <script src="js/ui/GameView.js"></script>
    <script src="js/ui/LoginView.js"></script>
    <script src="js/ui/MessageView.js"></script>

    <script src="js/controllers/NavigationController.js"></script>
    <script src="js/controllers/GameController.js"></script>
    <script src="js/controllers/LoginController.js"></script>

    <script src="js/Guardados.js"></script>


    <script>

        window.guardados = new Guardados();

        window.guardados.cargarDatos();

    </script>

</body>

</html>
